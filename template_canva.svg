<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- Background Light Gray -->
    <rect width="1920" height="1080" fill="#F4F7F6"/>
    
    <!-- Top Green Banner -->
    <rect width="1920" height="280" fill="#007A53"/>

    <!-- ================== HEADER ================== -->
    <!-- Vector Logo Mockup -->
    <g id="Logo">
        <!-- Hexagon Base -->
        <polygon points="100,35 130,52 130,87 100,105 70,87 70,52" fill="none" stroke="#FFFFFF" stroke-width="4"/>
        <!-- Network Dots -->
        <circle cx="100" cy="35" r="5" fill="#FFFFFF"/>
        <circle cx="130" cy="52" r="5" fill="#FFFFFF"/>
        <circle cx="130" cy="87" r="5" fill="#FFFFFF"/>
        <circle cx="100" cy="105" r="5" fill="#FFFFFF"/>
        <circle cx="70" cy="87" r="5" fill="#FFFFFF"/>
        <circle cx="70" cy="52" r="5" fill="#FFFFFF"/>
        <!-- Inner Book -->
        <path d="M100 60 L115 68 L115 88 L100 80 Z" fill="#FFFFFF"/>
        <path d="M100 60 L85 68 L85 88 L100 80 Z" fill="#FFFFFF"/>
        <!-- Text -->
        <text x="160" y="85" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="2">GESTOR</text>
    </g>

    <!-- Dashboard Title -->
    <text x="1450" y="85" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#FFFFFF">Painel de Inteligência de Dados</text>

    <!-- ================== KPI ROW (Aba para KPI) ================== -->
    <!-- KPI 1 -->
    <rect x="60" y="160" width="427" height="160" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="100" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#718096">ALUNOS NA REDE</text>
    <text x="100" y="270" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="#0B253A">2.945</text>
    <circle cx="430" cy="230" r="28" fill="#E6F2ED"/>
    <circle cx="430" cy="225" r="8" fill="#007A53"/>
    <path d="M415 245 Q430 225 445 245 L445 250 L415 250 Z" fill="#007A53"/>

    <!-- KPI 2 -->
    <rect x="517" y="160" width="427" height="160" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="557" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#718096">ESCOLAS ATIVAS</text>
    <text x="557" y="270" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="#0B253A">42</text>
    <circle cx="890" cy="230" r="28" fill="#E6F2ED"/>
    <rect x="880" y="220" width="20" height="20" fill="#007A53"/>
    <polygon points="890,210 905,220 875,220" fill="#007A53"/>

    <!-- KPI 3 -->
    <rect x="974" y="160" width="428" height="160" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="1014" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#718096">PROFESSORES</text>
    <text x="1014" y="270" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="#0B253A">4</text>
    <circle cx="1340" cy="230" r="28" fill="#E6F2ED"/>
    <path d="M1330 225 L1350 225 L1340 215 Z" fill="#007A53"/>

    <!-- KPI 4 -->
    <rect x="1432" y="160" width="428" height="160" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="1472" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#718096">TURMAS</text>
    <text x="1472" y="270" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="#0B253A">183</text>
    <circle cx="1800" cy="230" r="28" fill="#E6F2ED"/>
    <rect x="1790" y="215" width="20" height="25" fill="#007A53"/>

    <!-- ================== FOCUS DATA (Dados com enfoques) ================== -->
    <!-- Focus 1: Desempenho -->
    <rect x="60" y="360" width="885" height="280" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="100" y="420" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#718096">DESEMPENHO ACADÊMICO</text>
    <path d="M100 580 L250 510 L400 550 L550 460 L700 480 L850 430" fill="none" stroke="#2F80ED" stroke-width="6"/>
    <circle cx="100" cy="580" r="8" fill="#2F80ED"/>
    <circle cx="250" cy="510" r="8" fill="#2F80ED"/>
    <circle cx="400" cy="550" r="8" fill="#2F80ED"/>
    <circle cx="550" cy="460" r="8" fill="#2F80ED"/>
    <circle cx="700" cy="480" r="8" fill="#2F80ED"/>
    <circle cx="850" cy="430" r="8" fill="#2F80ED"/>

    <!-- Focus 2: Alertas -->
    <rect x="975" y="360" width="885" height="280" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="975" y="360" width="885" height="10" fill="#D32F2F" rx="5"/>
    <text x="1015" y="420" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#D32F2F">ALERTAS CRÍTICOS</text>
    
    <text x="1015" y="510" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#D32F2F">66</text>
    <text x="1130" y="490" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B253A">Alunos em distorção de idade</text>
    <line x1="1130" y1="510" x2="1800" y2="510" stroke="#E2E8F0" stroke-width="2"/>

    <text x="1015" y="610" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#D32F2F">12</text>
    <text x="1130" y="590" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0B253A">Alunos com risco de evasão imediato</text>
    <line x1="1130" y1="610" x2="1800" y2="610" stroke="#E2E8F0" stroke-width="2"/>

    <!-- ================== ANALYTICAL (Analítico embaixo) ================== -->
    <rect x="60" y="680" width="1800" height="340" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="100" y="740" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#718096">VISÃO ANALÍTICA DETALHADA</text>
    <line x1="100" y1="950" x2="1760" y2="950" stroke="#CBD5E0" stroke-width="3"/>
    
    <!-- Bar Chart -->
    <rect x="150" y="850" width="80" height="100" fill="#007A53" rx="5"/>
    <rect x="300" y="750" width="80" height="200" fill="#007A53" rx="5"/>
    <rect x="450" y="800" width="80" height="150" fill="#007A53" rx="5"/>
    <rect x="600" y="880" width="80" height="70" fill="#007A53" rx="5"/>
    <rect x="750" y="720" width="80" height="230" fill="#007A53" rx="5"/>
    <rect x="900" y="820" width="80" height="130" fill="#007A53" rx="5"/>
    <rect x="1050" y="780" width="80" height="170" fill="#007A53" rx="5"/>
    <rect x="1200" y="860" width="80" height="90" fill="#007A53" rx="5"/>
    <rect x="1350" y="710" width="80" height="240" fill="#007A53" rx="5"/>
    <rect x="1500" y="760" width="80" height="190" fill="#007A53" rx="5"/>
    <rect x="1650" y="830" width="80" height="120" fill="#007A53" rx="5"/>

</svg>
